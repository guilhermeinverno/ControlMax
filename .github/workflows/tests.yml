name: ControlMax Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Integration Tests (Firestore Emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Backend Dependencies & Firebase Tools
        run: |
          cd backend
          npm ci || npm install
          npm install -g firebase-tools

      - name: Run Backend Tests inside Firestore Emulator
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          LOCAL_DEV: "true"
        run: |
          npx firebase emulators:exec --only firestore "npm test --prefix backend"

  test-frontend:
    name: Frontend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Frontend Tests (excluding emulator rules)
        run: |
          cd frontend
          npx vitest run --exclude "**/firestore.rules.test.ts"
