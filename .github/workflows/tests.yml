name: ControlMax Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend-and-rules:
    name: Backend Integration Tests & Firestore Rules (Isolated Emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          cd backend && npm ci || npm install
          cd ../frontend && npm ci || npm install
          npm install -g firebase-tools

      - name: Run Backend & Firestore Rules Tests inside Firebase Emulator
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          LOCAL_DEV: "true"
        run: |
          npx firebase emulators:exec --only firestore "npm test --prefix backend && npm test --prefix frontend"
